<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Merchant Portal{% endblock %} · Caldova</title>
  <style>
    :root {
      --rb-navy: #111827;
      --rb-slate: #475569;
      --rb-cream: #fffaf4;
      --rb-peach: #ffedd5;
      --rb-orange: #f97316;
      --rb-orange-strong: #ea580c;
      --rb-green: #0f766e;
      --rb-green-soft: #d1fae5;
      --rb-card: rgba(255,255,255,0.82);
      --rb-line: rgba(148,163,184,0.25);
      --rb-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #fffaf4 0%, #f8fafc 100%);
      color: var(--rb-navy);
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rb-line);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 190px;
      height: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav a {
      color: var(--rb-slate);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      transition: all .2s ease;
    }

    .nav a:hover {
      background: rgba(249,115,22,0.07);
      color: var(--rb-orange-strong);
    }

    .nav form {
      display: inline;
      margin: 0;
    }

    .nav .logout {
      background: var(--rb-orange);
      color: white;
      border-radius: 999px;
      padding: 8px 14px;
      box-shadow: none;
      font: inherit;
    }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .flash {
      background: #fff3d6;
      border: 1px solid #f6d489;
      color: #7c4a00;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .panel {
      background: var(--rb-card);
      border: 1px solid var(--rb-line);
      border-radius: 24px;
      box-shadow: var(--rb-shadow);
    }

    .dashboard-shell {
      display: grid;
      gap: 22px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      padding: 24px;
      align-items: center;
    }

    .eyebrow {
      display: inline-block;
      background: var(--rb-peach);
      color: var(--rb-orange-strong);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.08;
      margin: 14px 0 12px;
    }

    .hero-copy p {
      color: var(--rb-slate);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .stat {
      background: white;
      border: 1px solid var(--rb-line);
      border-radius: 18px;
      padding: 18px 16px;
    }

    .stat strong {
      display: block;
      font-size: 1.8rem;
      margin-top: 8px;
      color: var(--rb-navy);
    }

    .hero-art {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
      background: linear-gradient(135deg, #fff7ed, #f0fdf4);
      border-radius: 20px;
      border: 1px solid rgba(15,23,42,0.05);
      padding: 8px;
    }

    .hero-art img {
      width: min(100%, 420px);
      height: auto;
    }

    .stack {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
    }

    .card {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--rb-line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--rb-shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(148,163,184,0.2);
      vertical-align: middle;
    }

    th {
      color: var(--rb-slate);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #ecfeff;
      color: #0f766e;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--rb-green-soft);
      color: #0f766e;
      font-weight: 700;
    }

    .form-shell {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 0;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid var(--rb-line);
      background: white;
      box-shadow: var(--rb-shadow);
    }

    .brand-panel {
      background: linear-gradient(135deg, #fff7ed, #ecfeff);
      padding: 42px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-panel img {
      width: 210px;
      margin-bottom: 22px;
    }

    .brand-panel h1 {
      margin-bottom: 10px;
    }

    .brand-panel p {
      color: var(--rb-slate);
      line-height: 1.6;
      margin-bottom: 0;
    }

    .login-panel {
      padding: 42px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
    }

    .field {
      margin-bottom: 18px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(148,163,184,0.8);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: white;
      color: var(--rb-navy);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(249,115,22,0.8);
      box-shadow: 0 0 0 4px rgba(249,115,22,0.12);
      outline: none;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--rb-orange), var(--rb-orange-strong));
      color: white;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(249,115,22,0.2);
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .muted {
      color: var(--rb-slate);
    }

    .receipt-box {
      background: #f8fafc;
      border: 1px solid var(--rb-line);
      border-radius: 16px;
      padding: 18px;
      margin-top: 18px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    @media (max-width: 850px) {
      .hero, .stack, .form-shell { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr; }
      .topbar-inner { flex-direction: column; align-items: flex-start; }
      .brand-logo { width: 170px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="{{ url_for('static', filename='caldova-logo.svg') }}" alt="Caldova logo">
      </div>
      <nav class="nav">
        <a href="{{ url_for('menus.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('menus.menu') }}">Catalog</a>
        <a href="{{ url_for('orders.board') }}">Orders</a>
        <a href="{{ url_for('receipts.editor') }}">Patient receipts</a>
        <a href="http://localhost:8200/chat" target="_blank" rel="noopener noreferrer">Chat with Agent</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="logout">Sign out</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="content">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
