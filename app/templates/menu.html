{% extends "base.html" %}
{% block title %}Menu{% endblock %}
{% block content %}
<h1>Menu</h1>

<form method="get" action="{{ url_for('menus.search') }}">
  <input name="q" value="{{ term or '' }}" placeholder="Search items">
  <button type="submit">Search</button>
</form>

<table style="margin-top: 16px;">
  <tr><th>Name</th><th>Price</th><th>Available</th><th></th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.name }}</td>
    <td>{{ format_price(item.price_cents) }}</td>
    <td>{{ "Yes" if item.available else "No" }}</td>
    <td><a href="{{ url_for('menus.edit_item', item_id=item.id) }}">Edit</a></td>
  </tr>
  {% endfor %}
</table>

<h2 style="margin-top: 24px;">Add item</h2>
<form method="post" action="{{ url_for('menus.create_item') }}">
  <input name="name" placeholder="Item name" required>
  <input name="price" placeholder="9.99">
  <button type="submit">Add</button>
</form>
{% endblock %}
